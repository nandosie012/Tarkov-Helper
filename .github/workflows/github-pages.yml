# Build + deploy naar GitHub Pages, elk uur opnieuw met verse data (flea-prijzen veranderen snel).
# Eenmalig nodig: Settings → Pages → Source = "GitHub Actions".
# Host je ergens anders (Vercel, Cloudflare, Netlify)? Zet dan de repository-variabele DEPLOY_TARGET
# op die naam (Settings → Secrets and variables → Actions → Variables); deze workflow slaat zich dan over.
name: GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: vars.DEPLOY_TARGET == '' || vars.DEPLOY_TARGET == 'github-pages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GAME_MODE: ${{ vars.GAME_MODE || 'regular' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
