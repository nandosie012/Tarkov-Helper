# Voor Vercel, Cloudflare Pages of Netlify: die bouwen zelf vanuit deze repo (npm run build).
# Deze workflow laat ze elk uur opnieuw bouwen, zodat de data vers blijft.
# Zet de deploy hook-URL van je platform als secret DEPLOY_HOOK_URL
# (Settings → Secrets and variables → Actions → Secrets). Zonder secret doet hij niets.
name: Verse data (deploy hook)

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy hook aanroepen
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "Geen DEPLOY_HOOK_URL ingesteld, niets te doen."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK_URL"
          echo "Nieuwe build aangevraagd."
